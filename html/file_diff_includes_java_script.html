<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Side-by-side File Diff (Offline)</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; background:#f7f7f5; margin:0; padding:24px; color:#222; }
  h1 { font-size:18px; font-weight:600; margin:0 0 16px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  label { font-size:13px; color:#555; display:block; margin-bottom:4px; }
  textarea { width:100%; height:220px; font-family:Consolas,monospace; font-size:12px; padding:8px;
             border:1px solid #ccc; border-radius:6px; background:#fff; color:#222; resize:vertical; box-sizing:border-box; }
  .controls { display:flex; gap:12px; align-items:center; margin-bottom:16px; }
  button { font-weight:600; padding:8px 16px; border:1px solid #999; border-radius:6px; background:#fff; cursor:pointer; }
  button:hover { background:#eee; }
  #stats { font-size:13px; color:#555; margin-left:auto; }
  #diffWrap { border:1px solid #ccc; border-radius:6px; overflow:hidden; background:#fff; }
  .difftable { font-family:Consolas,monospace; font-size:12px; max-height:600px; overflow:auto; }
  .drow { display:grid; grid-template-columns:45px 1fr 45px 1fr; border-bottom:1px solid #eee; }
  .lnum { padding:2px 6px; text-align:right; color:#999; background:#fafafa; }
  .cell { padding:2px 8px; white-space:pre-wrap; word-break:break-all; }
  .gap { padding:4px 12px; color:#999; background:#fafafa; text-align:center; }
  .bg-add { background:#e6ffed; }
  .bg-del { background:#ffeef0; }
  .bg-mod { background:#fff8e6; }
  .word-add { background:#acf2bd; border-radius:2px; }
  .word-del { background:#fdb8c0; border-radius:2px; text-decoration:line-through; }
</style>
</head>
<body>

<h1>Side-by-side File Diff (Offline)</h1>

<div class="row">
  <div>
    <label>Old file</label>
    <textarea id="oldTxt" placeholder="Paste original file content here"></textarea>
  </div>
  <div>
    <label>New file</label>
    <textarea id="newTxt" placeholder="Paste new file content here"></textarea>
  </div>
</div>

<div class="controls">
  <button id="cmpBtn">Compare</button>
  <label style="display:flex; align-items:center; gap:6px; margin:0;">
    <input type="checkbox" id="onlyChanges"> Only show changed lines (with context)
  </label>
  <span id="stats"></span>
</div>

<div id="diffWrap"></div>

<script>
/* ---------- Generic LCS-based diff (replaces jsdiff) ---------- */
// tokens: array of strings (lines, or words+whitespace). Returns array of
// {value, added, removed} matching jsdiff's diff output shape.
function lcsDiff(oldTokens, newTokens){
  const n = oldTokens.length, m = newTokens.length;
  // DP table for LCS lengths
  const dp = new Array(n+1);
  for(let i=0;i<=n;i++) dp[i] = new Uint32Array(m+1);
  for(let i=n-1;i>=0;i--){
    for(let j=m-1;j>=0;j--){
      dp[i][j] = (oldTokens[i]===newTokens[j])
        ? dp[i+1][j+1]+1
        : Math.max(dp[i+1][j], dp[i][j+1]);
    }
  }
  // Walk back through table building a run-length-encoded diff
  const result = [];
  let i=0, j=0;
  function push(type, val){
    const last = result[result.length-1];
    if(last && last.type===type){ last.value += val; }
    else result.push({type, value: val});
  }
  while(i<n && j<m){
    if(oldTokens[i]===newTokens[j]){ push('same', oldTokens[i]); i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]){ push('removed', oldTokens[i]); i++; }
    else { push('added', newTokens[j]); j++; }
  }
  while(i<n){ push('removed', oldTokens[i]); i++; }
  while(j<m){ push('added', newTokens[j]); j++; }
  return result.map(r => ({
    value: r.value,
    added: r.type==='added' ? true : undefined,
    removed: r.type==='removed' ? true : undefined
  }));
}

// Splits text into lines, keeping the trailing \n on each line (like jsdiff diffLines)
function splitLinesKeepEnds(text){
  const out = [];
  let start = 0;
  for(let k=0;k<text.length;k++){
    if(text[k]==='\n'){ out.push(text.slice(start,k+1)); start = k+1; }
  }
  if(start < text.length) out.push(text.slice(start));
  return out;
}

function diffLines(oldText, newText){
  return lcsDiff(splitLinesKeepEnds(oldText), splitLinesKeepEnds(newText));
}

// Splits a line into words + whitespace tokens (like jsdiff diffWordsWithSpace)
function splitWordsWithSpace(text){
  return text.match(/\s+|[^\s]+/g) || [];
}

function diffWordsWithSpace(oldText, newText){
  return lcsDiff(splitWordsWithSpace(oldText), splitWordsWithSpace(newText));
}
/* ---------------------------------------------------------------- */

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function inlineDiff(a,b){
  const parts = diffWordsWithSpace(a,b);
  let left='', right='';
  parts.forEach(p=>{
    const t = esc(p.value);
    if(p.added) right += '<span class="word-add">'+t+'</span>';
    else if(p.removed) left += '<span class="word-del">'+t+'</span>';
    else { left += t; right += t; }
  });
  return [left,right];
}

function render(){
  const oldText = document.getElementById('oldTxt').value;
  const newText = document.getElementById('newTxt').value;
  const onlyChanges = document.getElementById('onlyChanges').checked;
  const lineDiff = diffLines(oldText, newText);

  let rows = [];
  let oldNum=1, newNum=1;
  for(let i=0;i<lineDiff.length;i++){
    const part = lineDiff[i];
    const lines = part.value.split('\n');
    if(lines[lines.length-1]==='') lines.pop();

    if(!part.added && !part.removed){
      lines.forEach(l=>{ rows.push({type:'same', oldLine:l, newLine:l, oldNum:oldNum++, newNum:newNum++}); });
    } else if(part.removed){
      const next = lineDiff[i+1];
      if(next && next.added){
        const addLines = next.value.split('\n'); if(addLines[addLines.length-1]==='') addLines.pop();
        const max = Math.max(lines.length, addLines.length);
        for(let j=0;j<max;j++){
          if(j<lines.length && j<addLines.length){
            rows.push({type:'mod', oldLine:lines[j], newLine:addLines[j], oldNum:oldNum++, newNum:newNum++});
          } else if(j<lines.length){
            rows.push({type:'del', oldLine:lines[j], newLine:'', oldNum:oldNum++, newNum:null});
          } else {
            rows.push({type:'add', oldLine:'', newLine:addLines[j], oldNum:null, newNum:newNum++});
          }
        }
        i++;
      } else {
        lines.forEach(l=>{ rows.push({type:'del', oldLine:l, newLine:'', oldNum:oldNum++, newNum:null}); });
      }
    } else if(part.added){
      lines.forEach(l=>{ rows.push({type:'add', oldLine:'', newLine:l, oldNum:null, newNum:newNum++}); });
    }
  }

  const nAdd = rows.filter(r=>r.type==='add').length;
  const nDel = rows.filter(r=>r.type==='del').length;
  const nMod = rows.filter(r=>r.type==='mod').length;
  document.getElementById('stats').textContent = nAdd+' added \u00b7 '+nDel+' removed \u00b7 '+nMod+' modified';

  let displayRows = rows;
  if(onlyChanges){
    const ctx=1;
    const keep = new Array(rows.length).fill(false);
    rows.forEach((r,idx)=>{
      if(r.type!=='same'){
        for(let k=Math.max(0,idx-ctx); k<=Math.min(rows.length-1,idx+ctx); k++) keep[k]=true;
      }
    });
    displayRows=[]; let lastKept=-2;
    rows.forEach((r,idx)=>{
      if(keep[idx]){
        if(idx-lastKept>1) displayRows.push({type:'gap'});
        displayRows.push(r);
        lastKept=idx;
      }
    });
  }

  const bgClass = { same:'', add:'bg-add', del:'bg-del', mod:'bg-mod' };
  let html = '<div class="difftable">';
  displayRows.forEach(r=>{
    if(r.type==='gap'){ html += '<div class="gap">\u22ef</div>'; return; }
    let leftHtml, rightHtml;
    if(r.type==='mod'){ [leftHtml, rightHtml] = inlineDiff(r.oldLine, r.newLine); }
    else { leftHtml = esc(r.oldLine); rightHtml = esc(r.newLine); }
    const lnum = r.oldNum ?? '';
    const rnum = r.newNum ?? '';
    const leftBg  = (r.type==='add') ? '' : bgClass[r.type];
    const rightBg = (r.type==='del') ? '' : bgClass[r.type];
    html += '<div class="drow">'
      + '<div class="lnum">'+lnum+'</div>'
      + '<div class="cell '+leftBg+'">'+leftHtml+'</div>'
      + '<div class="lnum">'+rnum+'</div>'
      + '<div class="cell '+rightBg+'">'+rightHtml+'</div>'
      + '</div>';
  });
  html += '</div>';
  document.getElementById('diffWrap').innerHTML = html;
}

document.getElementById('cmpBtn').addEventListener('click', render);
document.getElementById('onlyChanges').addEventListener('change', render);
</script>

</body>
</html>
